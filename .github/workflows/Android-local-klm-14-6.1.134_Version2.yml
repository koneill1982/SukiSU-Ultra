name: Build LKM for KernelSU Local

on:
┆  workflow_call:
┆┆    inputs:
┆┆┆      upload:
┆┆┆┆        required: true
┆┆┆┆        type: boolean
┆┆┆┆        default: true
┆┆┆┆        description: "Whether to upload to branch"
┆┆    secrets:
┆┆┆      TOKEN:
┆┆┆┆        required: true
┆  workflow_dispatch:
┆┆    inputs:
┆┆┆      upload:
┆┆┆┆        required: true
┆┆┆┆        type: boolean
┆┆┆┆        default: true
┆┆┆┆        description: "Whether to upload to branch"

jobs:
┆  build-lkm:
┆┆    name: Build LKM ${{ matrix.version }}.${{ matrix.sub_level }}
┆┆    strategy:
┆┆┆      matrix:
┆┆┆┆        include:
┆┆┆┆┆          - version: "android14-6.1"
┆┆┆┆┆┆            sub_level: 134
┆┆┆┆┆┆            os_patch_level: 2025-05
┆┆    uses: ./.github/workflows/gki-kernel-local.yml
┆┆    with:
┆┆┆      version: ${{ matrix.version }}
┆┆┆      version_name: ${{ matrix.version }}.${{ matrix.sub_level }}
┆┆┆      tag: ${{ matrix.version }}-${{ matrix.os_patch_level }}
┆┆┆      os_patch_level: ${{ matrix.os_patch_level }}
┆┆┆      build_lkm: true
┆┆    secrets:
┆┆┆      BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}
┆┆┆      CHAT_ID: ${{ secrets.CHAT_ID }}
┆┆┆      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
┆┆┆      MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}

┆  push-to-branch:
┆┆    name: Push LKM to Repository
┆┆    needs: [build-lkm]
┆┆    runs-on: self-hosted
┆┆    if: ${{ inputs.upload }}
┆┆    steps:
┆┆┆      - name: Checkout repository
┆┆┆┆        uses: actions/checkout@v4
┆┆┆┆        with:
┆┆┆┆┆          fetch-depth: 0

┆┆┆      - name: Download all workflow run artifacts
┆┆┆┆        uses: actions/download-artifact@v4
┆┆┆┆        with:
┆┆┆┆┆          path: lkm-artifacts/
┆┆┆┆┆          merge-multiple: true

┆┆┆      - name: Configure Git
┆┆┆┆        run: |
┆┆┆┆┆          git config --global user.email "bot@kernelsu.org"
┆┆┆┆┆          git config --global user.name "KernelSUBot"

┆┆┆      - name: Setup LKM branch
┆┆┆┆        run: |
┆┆┆┆┆          if git rev-parse --verify origin/lkm > /dev/null 2>&1; then
┆┆┆┆┆┆            git checkout -b lkm origin/lkm
┆┆┆┆┆          else
┆┆┆┆┆┆            git checkout --orphan lkm
┆┆┆┆┆┆            git rm -rf .
┆┆┆┆┆          fi

┆┆┆      - name: Copy and organize artifacts
┆┆┆┆        run: |
┆┆┆┆┆          mkdir -p lkm-artifacts
┆┆┆┆┆          find . -name "*.ko" -type f ! -path "./lkm-artifacts/*" -exec mv {} lkm-artifacts/ \;
┆┆┆┆┆          cd lkm-artifacts
┆┆┆┆┆          echo "LKM artifacts found:"
┆┆┆┆┆          ls -lh *.ko 2>/dev/null || echo "No .ko files found"

┆┆┆      - name: Commit artifacts
┆┆┆┆        run: |
┆┆┆┆┆          cd lkm-artifacts
┆┆┆┆┆          git add *.ko
┆┆┆┆┆          if ! git diff --cached --quiet; then
┆┆┆┆┆┆            git commit -m "LKM build: $(date '+%Y-%m-%d %H:%M:%S')"
┆┆┆┆┆          else
┆┆┆┆┆┆            echo "No changes to commit"
┆┆┆┆┆┆            exit 0
┆┆┆┆┆          fi

┆┆┆      - name: Push to LKM branch
┆┆┆┆        env:
┆┆┆┆┆          TOKEN: ${{ secrets.TOKEN }}
┆┆┆┆        run: |
┆┆┆┆┆          git remote set-url origin https://${{ github.actor }}:${TOKEN}@github.com/${{ github.repository }}.git
┆┆┆┆┆          git push -u origin lkm --force

┆┆┆      - name: Verify and report
┆┆┆┆        if: always()
┆┆┆┆        run: |
┆┆┆┆┆          echo "=== LKM Build Summary ==="
┆┆┆┆┆          echo "Repository: ${{ github.repository }}"
┆┆┆┆┆          echo "Branch: lkm"
┆┆┆┆┆          echo ""
┆┆┆┆┆          echo "Generated artifacts:"
┆┆┆┆┆          find lkm-artifacts -name "*.ko" -type f -exec ls -lh {} \;
┆┆┆┆┆          echo ""
┆┆┆┆┆          echo "Build completed at: $(date)"